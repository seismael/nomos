# Agent Governance Registry — Single Source of Truth
# Every artifact in .agents/ must be listed here.
# Adding a new artifact = file + this registry entry. Nothing else.

version: "1.0.0"
framework_version: "1.0.0"
active_profile: full

layers:
  - id: L1
    name: base
    description: "Always applied — baseline conventions and defaults"
    mandatory: true
  - id: L2
    name: phase
    description: "Applied by phase match"
    mandatory: true
  - id: L3
    name: type
    description: "Applied by type match"
    mandatory: true
  - id: L4
    name: complexity
    description: "Governance gates"
    mandatory: true
  - id: L5
    name: project
    description: "Project-specific overrides"
    mandatory: false

artifacts:
  # ─── L1: Conventions (always loaded) ───

  - path: base/conventions/general.md
    role: convention
    triggers: { phase: "*", type: "*", complexity: "*", valid: true }
    layer: base
    priority: 1
    status: active
    context_cost: low
    overridable: true
    override_strategy: extend
    description: "Surgical precision, YAGNI, DRY, readability, defensive minimalism"

  - path: base/conventions/naming.md
    role: convention
    triggers: { phase: "*", type: "*", complexity: "*", valid: true }
    layer: base
    priority: 2
    status: active
    context_cost: low
    overridable: true
    override_strategy: extend
    description: "Descriptive names, no abbreviations, domain language"

  - path: base/conventions/structure.md
    role: convention
    triggers: { phase: "*", type: "*", complexity: "*", valid: true }
    layer: base
    priority: 3
    status: active
    context_cost: low
    overridable: true
    override_strategy: extend
    description: "Domain-based organization, file size limits, module boundaries"

  - path: base/conventions/testing.md
    role: convention
    triggers: { phase: "*", type: "*", complexity: "*", valid: true }
    layer: base
    priority: 4
    status: active
    context_cost: low
    overridable: true
    override_strategy: extend
    description: "TDD as default, red-green-refactor, test pyramid"

  - path: base/conventions/documentation.md
    role: convention
    triggers: { phase: "*", type: "*", complexity: "*", valid: true }
    layer: base
    priority: 5
    status: active
    context_cost: low
    overridable: true
    override_strategy: extend
    description: "Doc why not what, public API docs, ADR format"

  - path: base/conventions/error-handling.md
    role: convention
    triggers: { phase: "*", type: "*", complexity: "*", valid: true }
    layer: base
    priority: 6
    status: active
    context_cost: low
    overridable: true
    override_strategy: extend
    description: "Error classification, catch at boundaries, fail fast"

  # ─── L1: Config (always loaded) ───

  - path: base/config/tools/default-tools.md
    role: config
    triggers: { phase: "*", type: "*", complexity: "*", valid: true }
    layer: base
    priority: 20
    status: active
    context_cost: low
    overridable: true
    override_strategy: extend
    description: "Git conventions, linting, testing frameworks, package management"

  - path: base/config/templates/design-doc-template.md
    role: config
    triggers: { phase: "*", type: "*", complexity: "*", valid: true }
    layer: base
    priority: 30
    status: active
    context_cost: low
    overridable: true
    override_strategy: replace
    description: "Template for design documents"

  - path: base/config/templates/adr-template.md
