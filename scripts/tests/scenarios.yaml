      - base/capabilities/personas/architect.md
      - base/orchestration/gates.yaml
      - base/orchestration/approval-flows.md
      - base/orchestration/subagents/default-subagents.md
      - project/context/README.md
      - project/conventions/README.md
      - project/config/README.md
      - project/orchestration/README.md
    expected_gates: [plan-approved, design-approved, review-approved, test-passed, deploy-approved]

  - name: "Review a standard feature"
    triggers: { phase: review, type: feature, complexity: standard }
