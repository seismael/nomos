      - base/capabilities/skills/feature-development.md
      - base/capabilities/personas/reviewer.md
      - base/orchestration/gates.yaml
      - base/orchestration/subagents/default-subagents.md
      - project/context/README.md
      - project/conventions/README.md
      - project/config/README.md
      - project/orchestration/README.md
    expected_gates: [verify-complete]

  - name: "Trivial docs update"
